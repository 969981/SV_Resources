name: Verify vendored gftool and NxMiddleware

on:
  push:
    paths:
      - 'tools/gftool/**'
      - 'tools/upstream.json'
      - 'tests/test_sv_tool_submodules.py'
      - '.github/workflows/vendor-gftool-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            scripts
            tests
          sparse-checkout-cone-mode: true
          submodules: false
      - name: Verify no Gitlinks remain
        run: |
          test -z "$(git ls-tree -r HEAD | grep '^160000 ' || true)"
          test -f tools/gftool/GFTool.Core/GFTool.Core.csproj
          test -f tools/gftool/NxMiddleware/BnTxx/BnTxx.csproj
      - name: Verify six pinned tool trees
        run: python3 -m unittest discover -s tests -p test_sv_tool_submodules.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile TrinityDump with vendored GFTool.Core
        run: dotnet build tools/SV.TrinityDump/SV.TrinityDump.csproj -c Release --nologo
