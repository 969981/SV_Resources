name: SV Gen9 PK9 LegalityAnalysis real fixture and native candidate checks
on:
  pull_request:
    paths:
      - 'tools/PKHeX.Gen9LegalityProbe/**'
      - '.github/workflows/sv-pk9-legality-runtime.yml'
  push:
    branches: [master]
    paths:
      - 'tools/PKHeX.Gen9LegalityProbe/**'
      - '.github/workflows/sv-pk9-legality-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pk9-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/PKHeX.Gen9LegalityProbe/**
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch precisely pinned PKHeX Core code and public legal PK9 samples
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pinned-pkhex"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/kwsch/PKHeX.git
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone \
            'PKHeX.Core/**' \
            'Tests/PKHeX.Core.Tests/Legality/Legal/Generation 9/**' \
            'Tests/PKHeX.Core.Tests/Legality/Legal/General/*.pk9' \
            'Directory.Build.props' 'Directory.Build.targets' 'global.json' 'icon.png'
          git -C "$root" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin 0660d1e1f4924b8478daec73281bb8071a82ad19
          git -C "$root" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          count=$(find "$root/Tests/PKHeX.Core.Tests/Legality/Legal" -type f -name '*.pk9' | wc -l)
          test "$count" -ge 6
          echo "PKHEX_PINNED_ROOT=$root" >> "$GITHUB_ENV"
          echo "PKHeX pinned source SHA: $(git -C "$root" rev-parse HEAD)"
          echo "Actual public legal Gen9 PK9 samples found: $count"
      - name: Compile against pinned PKHeX.Core source, not mismatched NuGet
        shell: bash
        run: |
          dotnet build tools/PKHeX.Gen9LegalityProbe/PKHeX.Gen9LegalityProbe.csproj -c Release --nologo -p:PKHeXRoot="$PKHEX_PINNED_ROOT"
      - name: Run real PK9 LegalityAnalysis and mutated MetLevel=0 negative controls
        shell: bash
        run: |
          dotnet tools/PKHeX.Gen9LegalityProbe/bin/Release/net10.0/PKHeX.Gen9LegalityProbe.dll \
            --pkhex-tests "$PKHEX_PINNED_ROOT/Tests/PKHeX.Core.Tests" \
            --output "$RUNNER_TEMP/real-gen9-legality"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-pk9-real-legalityanalysis-baseline
          path: |
            ${{ runner.temp }}/real-gen9-legality/*.json
          if-no-files-found: warn
          retention-days: 30
