name: Analyze SV TREVT and TRPRE native links

on:
  push:
    paths:
      - 'scripts/Analyze-SV-EventPrefetch-Links.py'
      - 'scripts/Investigate-SV-EventPrefetch-Gaps.py'
      - 'scripts/Recover-SV-Prefetch-Missing.py'
      - '.github/workflows/analyze-sv-event-prefetch-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sv-event-prefetch-link-analysis
  cancel-in-progress: false

jobs:
  native-cross-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            4.0.0/0
            4.0.0/1/event
            4.0.0/1/system
            tools/PokeDocs/SV/Hashlists/FileSystem
            Unpack/4.0.0/romfs/event
            Unpack/4.0.0/romfs/system
            Unpack/4.0.0/romfs/arc/data.trpfd
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the independently decoded TREVT and TRPRE files
        run: python scripts/Unpack-SV-EventPrefetch.py --repo . --verify-only
      - name: Check analysis syntax
        run: python -m py_compile scripts/Analyze-SV-EventPrefetch-Links.py scripts/Investigate-SV-EventPrefetch-Gaps.py scripts/Recover-SV-Prefetch-Missing.py
      - name: Install disassembly-only dependency
        run: python -m pip install 'capstone==5.0.6'
      - name: Run native exact-match and NSO scanning
        run: python scripts/Analyze-SV-EventPrefetch-Links.py --repo .
      - name: Inspect remaining unmapped 64-bit keys and disassemble native callsites
        run: python scripts/Investigate-SV-EventPrefetch-Gaps.py --repo .
      - name: Recover remaining prefetch names using independent PokeDocs hash lists
        run: python scripts/Recover-SV-Prefetch-Missing.py --repo .
      - name: Commit only reproducible evidence, without rewriting upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Unpack/4.0.0/romfs/event/trevt/bin/event.trevt/_index/event_reference_resolution.csv \
            Unpack/4.0.0/romfs/event/trevt/bin/event.trevt/_index/event_reference_audit.json \
            Unpack/4.0.0/romfs/event/trevt/bin/event.trevt/_index/native_exefs_evidence.json \
            Unpack/4.0.0/romfs/event/trevt/bin/event.trevt/_index/native_string_xrefs.csv \
            Unpack/4.0.0/romfs/system/prefetch/data/_index/prefetch_trpfd_exact_matches.csv \
            Unpack/4.0.0/romfs/system/prefetch/data/_index/prefetch_trpfd_audit.json \
            Unpack/4.0.0/romfs/system/prefetch/data/_index/prefetch_trpfd_unmatched.csv \
            Unpack/4.0.0/romfs/system/prefetch/data/_index/prefetch_match_categories.json \
            Unpack/4.0.0/romfs/event/trevt/bin/event.trevt/_index/native_callsite_disassembly.json \
            Unpack/4.0.0/romfs/system/prefetch/data/_index/prefetch_unmatched_pokedocs.csv \
            Unpack/4.0.0/romfs/system/prefetch/data/_index/prefetch_unmatched_pokedocs_audit.json
          if git diff --cached --quiet; then
            echo "Native evidence unchanged; no commit."
            exit 0
          fi
          git commit -m "data(research): verify SV event edges and prefetch TRPFD exact hashes"
          git push origin HEAD:master
