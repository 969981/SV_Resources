name: SV400 pinned ZAScripts Haxe ABI integration
on:
  push:
    branches: [master]
    paths:
      - "tools/SV.Lua54/haxe/4.0.0/**"
      - "scripts/Verify-SV-ZA-Haxe-ABI.py"
      - "scripts/Build-SV-Haxe-Native-FnFixtures.py"
      - "scripts/Emit-SV-Haxe-R10-ConstantReturns.py"
      - "tools/SV.Lua54/src/sv_lua54/emit_haxe/**"
      - ".github/workflows/slr-haxe-zascripts-abi.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools/SV.Lua54/haxe/4.0.0
            scripts/Verify-SV-ZA-Haxe-ABI.py
            scripts/Build-SV-Haxe-Native-FnFixtures.py
            scripts/Emit-SV-Haxe-R10-ConstantReturns.py
            tools/PokeDocs/SV/Hashlists/Lua
            tools/SV.Lua54/src/sv_lua54
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/script/lua/bin/release/main/main.blua
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/script/lua/bin/release/dll_util/dll_util.blua
          sparse-checkout-cone-mode: false
      - name: Checkout exact upstream compiler / HashAbi / cppbindings / finalizer
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(python3 -c 'import json;print(json.load(open("tools/SV.Lua54/haxe/4.0.0/zascripts.lock.json"))["upstream_commit"])')
          UPSTREAM="$RUNNER_TEMP/ZAScripts"
          git init -q "$UPSTREAM"
          git -C "$UPSTREAM" remote add origin https://github.com/Reisyukaku/ZAScripts.git
          git -C "$UPSTREAM" -c protocol.version=2 fetch -q --no-tags --depth 1 --filter=blob:none origin "$PIN"
          git -C "$UPSTREAM" sparse-checkout init --cone
          git -C "$UPSTREAM" sparse-checkout set tools/haxe-4.3.1 tools/gfl_build tools/lua-5.4.3/src
          git -C "$UPSTREAM" checkout -q --detach FETCH_HEAD
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$PIN"
          test -f "$UPSTREAM/tools/haxe-4.3.1/std/haxe/macro/HashAbi.hx"
          test -f "$UPSTREAM/tools/haxe-4.3.1/std/haxe/macro/abi/LuaOutput.hx"
          test -f "$UPSTREAM/tools/gfl_build/build_post_process.py"
          test -f "$UPSTREAM/tools/haxe-4.3.1/std/cppbindings/C016374C1.hx"
          test -x "$UPSTREAM/tools/haxe-4.3.1/haxe"
          echo "UPSTREAM=$UPSTREAM" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$UPSTREAM/tools/haxe-4.3.1/std" >> "$GITHUB_ENV"
          echo "Pinned upstream: $PIN"
      - name: Check Haxe 4.3.1 and build pinned Lua5.4.3 compiler
        run: |
          "$UPSTREAM/tools/haxe-4.3.1/haxe" --version
          make -C "$UPSTREAM/tools/lua-5.4.3/src" linux MYLDFLAGS=-no-pie -j2 >/dev/null
          "$UPSTREAM/tools/lua-5.4.3/src/luac" -v
      - name: Compile main + dll_util through upstream HashAbi and LuaOutput finalizer
        working-directory: tools/SV.Lua54/haxe/4.0.0
        run: |
          mkdir -p build
          "$UPSTREAM/tools/haxe-4.3.1/haxe" build-za-main.hxml
          "$UPSTREAM/tools/haxe-4.3.1/haxe" build-za-dll-util.hxml
          "$UPSTREAM/tools/lua-5.4.3/src/luac" -p build/za_main.lua build/za_dll_util.lua
          "$UPSTREAM/tools/lua-5.4.3/src/luac" -s -o build/za_main.blua build/za_main.lua
          "$UPSTREAM/tools/lua-5.4.3/src/luac" -s -o build/za_dll_util.blua build/za_dll_util.lua
      - name: Verify HashAbi rejects an intentionally corrupted S hash
        working-directory: tools/SV.Lua54/haxe/4.0.0
        run: |
          set -euo pipefail
          BAD="$RUNNER_TEMP/sv400-hashabi-negative"
          mkdir -p "$BAD/build"
          cp -R source "$BAD/source"
          cp build-za-main.hxml "$BAD/build-za-main.hxml"
          sed -i 's/@:hashAbi("S042B860498E558B2")/@:hashAbi("S0000000000000000")/' "$BAD/source/main/util/StrUtil.hx"
          if (cd "$BAD" && "$UPSTREAM/tools/haxe-4.3.1/haxe" build-za-main.hxml > "$BAD/hashabi-error.log" 2>&1); then
            echo "ERROR: HashAbi accepted a deliberately invalid static method hash"
            exit 1
          fi
          grep -F "Recovered name Format hashes to S042B860498E558B2, expected S0000000000000000" "$BAD/hashabi-error.log"
      - name: Verify C/S symbols and finalizer fingerprints
        run: python3 scripts/Verify-SV-ZA-Haxe-ABI.py
      - name: Build temporary bit-exact original SV400 child Lua54 functions
        run: |
          python3 scripts/Build-SV-Haxe-Native-FnFixtures.py --out "$RUNNER_TEMP/sv400-haxe-native"
          "$UPSTREAM/tools/lua-5.4.3/src/luac" -p \
            "$RUNNER_TEMP/sv400-haxe-native/CalcXFov.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/Format.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/Clamp.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/ActionChairBegin.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/BattleStartIdle.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/EventOnCreate.luac"
      - name: Reconstruct original Lua CFG/HIR/AST into deterministic Haxe source
        run: |
          python3 scripts/Emit-SV-Haxe-R10-ConstantReturns.py \
            --output "$RUNNER_TEMP/sv400-r10-generated" \
            --native-output "$RUNNER_TEMP/sv400-haxe-native" \
            --verify-repo-source
          "$UPSTREAM/tools/lua-5.4.3/src/luac" -p \
            "$RUNNER_TEMP/sv400-haxe-native/R10_14216.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/R10_14223.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/R10_6349.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/R10_689.luac" \
            "$RUNNER_TEMP/sv400-haxe-native/R10_699.luac"
      - name: Native original bytecode vs pinned Haxe generated Lua differential
        run: |
          "$UPSTREAM/tools/lua-5.4.3/src/lua" \
            tools/SV.Lua54/haxe/4.0.0/compare-native-vs-za.lua \
            "$RUNNER_TEMP/sv400-haxe-native" \
            tools/SV.Lua54/haxe/4.0.0/build/za_main.lua \
            tools/SV.Lua54/haxe/4.0.0/build/za_dll_util.lua \
            "$RUNNER_TEMP/sv400-haxe-native/differential-report.json"
          python3 -c 'import json,os,pathlib;p=pathlib.Path(os.environ["RUNNER_TEMP"])/"sv400-haxe-native/differential-report.json";d=json.loads(p.read_text());assert d["status"]=="PASS" and len(d["methods"])==11 and sum(m["passed"] for m in d["methods"])==56 and all(m["cases"]>0 and m["passed"]==m["cases"] for m in d["methods"]);print(json.dumps(d,indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv400-zascripts-abi-lua
          path: |
            tools/SV.Lua54/haxe/4.0.0/build/za_main.lua
            tools/SV.Lua54/haxe/4.0.0/build/za_dll_util.lua
            ${{ runner.temp }}/sv400-haxe-native/differential-report.json
            ${{ runner.temp }}/sv400-haxe-native/fixture-provenance.json
            ${{ runner.temp }}/sv400-r10-generated/r10-manifest.json
          if-no-files-found: ignore
          retention-days: 7
