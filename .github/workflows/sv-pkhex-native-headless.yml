name: SV native 4.0.0 to PKHeX - real pkNX encounter rebuild
on:
  pull_request:
    paths:
      - 'tools/SV.PkNXEncounterCLI/**'
      - '.github/workflows/sv-pkhex-native-headless.yml'
      - 'scripts/Compare-SV-Native-PKHeX-Encounters.py'
      - 'tests/test_sv_native_pkhex_comparison.py'
  push:
    branches: [master]
    paths:
      - 'tools/SV.PkNXEncounterCLI/**'
      - '.github/workflows/sv-pkhex-native-headless.yml'
      - 'scripts/Compare-SV-Native-PKHeX-Encounters.py'
      - 'tests/test_sv_native_pkhex_comparison.py'
      - 'Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json'
      - 'Unpack/4.0.0/romfs/arc/data.trpfs/virtual/world/**'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/pkNX/**
            tools/SV.PkNXEncounterCLI/**
            scripts/Compare-SV-Native-PKHeX-Encounters.py
            scripts/Audit-SV-PKHeX-Encounters.py
            tests/test_sv_native_pkhex_comparison.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile unmodified native pkNX Gen9 encounter rules, without GUI
        run: |
          dotnet build tools/SV.PkNXEncounterCLI/SV.PkNXEncounterCLI.csproj -c Release --nologo
          test -s tools/SV.PkNXEncounterCLI/bin/Release/net10.0/all_fog.txt
      - name: Synthetic delta and native evidence tests
        run: python -m unittest discover -s tests -p test_sv_native_pkhex_comparison.py -v

  generate-and-compare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/pkNX/**
            tools/SV.PkNXEncounterCLI/**
            scripts/Audit-SV-PKHeX-Encounters.py
            scripts/Compare-SV-Native-PKHeX-Encounters.py
            Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/world/**
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/message/dat/English/common/place_name.*
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real game source evidence
        id: source
        run: |
          if test -f Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Original game 61-file SHA manifest not yet published; native generation BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build exact pkNX Gen9 CLI
        if: steps.source.outputs.available == 'true'
        run: dotnet build tools/SV.PkNXEncounterCLI/SV.PkNXEncounterCLI.csproj -c Release --nologo
      - name: Run real world spawner and collider algorithm
        if: steps.source.outputs.available == 'true'
        id: native
        continue-on-error: true
        run: |
          dotnet tools/SV.PkNXEncounterCLI/bin/Release/net10.0/SV.PkNXEncounterCLI.dll \
            --virtual-root Unpack/4.0.0/romfs/arc/data.trpfs/virtual \
            --verified-manifest Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json \
            --output "$RUNNER_TEMP/sv-native-pkhex"
      - name: Fetch PINNED PKHeX reference independently
        if: steps.source.outputs.available == 'true'
        run: |
          root="$RUNNER_TEMP/pkhex"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/kwsch/PKHeX.git
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone 'PKHeX.Core/Resources/legality/wild/Gen9/*'
          git -C "$root" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin 0660d1e1f4924b8478daec73281bb8071a82ad19
          git -C "$root" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
      - name: Field-level original game vs PKHeX legality comparison
        if: steps.source.outputs.available == 'true'
        id: compare
        continue-on-error: true
        run: |
          python scripts/Compare-SV-Native-PKHeX-Encounters.py \
            --native-manifest Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json \
            --build-evidence "$RUNNER_TEMP/sv-native-pkhex/native-encounter-build.json" \
            --generated "$RUNNER_TEMP/sv-native-pkhex" \
            --reference "$RUNNER_TEMP/pkhex/PKHeX.Core/Resources/legality/wild/Gen9" \
            --output "$RUNNER_TEMP/sv-encounter-diff"
      - name: Report explicitly which gate passed and failed
        if: always()
        shell: bash
        run: |
          echo '## Native SV 4.0.0 to PKHeX encounter comparison' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/sv-encounter-diff/native-comparison.json"; then
            cat "$RUNNER_TEMP/sv-encounter-diff/native-comparison.json" >> "$GITHUB_STEP_SUMMARY"
          elif test -f "$RUNNER_TEMP/sv-native-pkhex/native-encounter-failure.json"; then
            cat "$RUNNER_TEMP/sv-native-pkhex/native-encounter-failure.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Blocked: original source data absent or native CLI did not run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-native-gen9-encounter-regression
          path: |
            ${{ runner.temp }}/sv-native-pkhex/*.json
            ${{ runner.temp }}/sv-encounter-diff/*.json
            ${{ runner.temp }}/sv-encounter-diff/*.csv
          if-no-files-found: warn
          retention-days: 30
