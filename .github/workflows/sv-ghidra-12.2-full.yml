name: SV 4.0.0 Scarlet Violet complete Ghidra 12.2 project and decompilation
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sv-ghidra-12.2-full.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: sv400-ghidra12-full-publish
  cancel-in-progress: false

jobs:
  analyze:
    name: Ghidra 12.2 full decompile ${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        game: [scarlet_main, violet_main]
    env:
      GAME: ${{ matrix.game }}
      GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_SHA: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
    steps:
      - name: Sparse checkout both published ELF files and the exporter
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            Unpack/4.0.0/exefs/scarlet_main/scarlet_main.elf
            Unpack/4.0.0/exefs/violet_main/violet_main.elf
            tools/ghidra/sv/
            .github/workflows/sv-ghidra-12.2-full.yml

      - name: Set up Ghidra 12.2 runtime (JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify correct original ELF and preflight Python tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pyelftools==0.32'
          python3 -m py_compile tools/ghidra/sv/*.py
          ELF="Unpack/4.0.0/exefs/$GAME/$GAME.elf"
          case "$GAME" in
            scarlet_main) sha=53776abb60a9d316b7b5365e0091cb7c971e62ffbf493e4541184f0d955aa79f ;;
            violet_main) sha=84e1e6c1ae3d4122eb736045cda82d075a189c718e9ba024a9fa90ee726f7d30 ;;
            *) exit 2 ;;
          esac
          test -s "$ELF"
          printf '%s  %s\n' "$sha" "$ELF" | sha256sum --check
          readelf -h "$ELF" | grep -q AArch64
          OUT="$RUNNER_TEMP/sv400_out/$GAME"
          mkdir -p "$OUT" "$RUNNER_TEMP/sv400_projects/$GAME"
          python3 tools/ghidra/sv/sv400_fde.py --elf "$ELF" --out "$OUT"

      - name: Download and verify official Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 --output "$RUNNER_TEMP/$GHIDRA_ZIP" "$GHIDRA_URL"
          printf '%s  %s\n' "$GHIDRA_SHA" "$RUNNER_TEMP/$GHIDRA_ZIP" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sv400_ghidra"
          unzip -q "$RUNNER_TEMP/$GHIDRA_ZIP" -d "$RUNNER_TEMP/sv400_ghidra"
          headless="$(find "$RUNNER_TEMP/sv400_ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$headless"
          chmod +x "$headless"
          echo "GHIDRA_HEADLESS=$headless" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/$GHIDRA_ZIP"

      - name: Analyze, FDE recovery, export every function / reference / instruction / C status
        shell: bash
        run: |
          set -euo pipefail
          ELF="$GITHUB_WORKSPACE/Unpack/4.0.0/exefs/$GAME/$GAME.elf"
          OUT="$RUNNER_TEMP/sv400_out/$GAME"
          timeout --signal=TERM --kill-after=30s 310m \
            "$GHIDRA_HEADLESS" "$RUNNER_TEMP/sv400_projects/$GAME" SV400 \
            -import "$ELF" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra/sv" \
            -analysisTimeoutPerFile 13000 -max-cpu 2 \
            -postScript SV400RecoverFDE.java "$OUT/fde_ranges.csv.gz" "$OUT/fde_recovery.csv" \
            -postScript SV400Export.java "$OUT/sv400_ghidra_events.ndjson.gz" all 20 \
            -log "$OUT/ghidra_headless.log" \
            -scriptlog "$OUT/ghidra_script.log" \
            2>&1 | tee "$OUT/ghidra_console.log"
          test -s "$OUT/sv400_ghidra_events.ndjson.gz"
          test -s "$OUT/fde_recovery.csv"
          test -f "$RUNNER_TEMP/sv400_projects/$GAME/SV400.gpr"
          test -d "$RUNNER_TEMP/sv400_projects/$GAME/SV400.rep"

      - name: Validate complete Ghidra event stream, SQLite and per-function C coverage
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sv400_out/$GAME"
          ELF="Unpack/4.0.0/exefs/$GAME/$GAME.elf"
          case "$GAME" in
            scarlet_main) sha=53776abb60a9d316b7b5365e0091cb7c971e62ffbf493e4541184f0d955aa79f ;;
            violet_main) sha=84e1e6c1ae3d4122eb736045cda82d075a189c718e9ba024a9fa90ee726f7d30 ;;
          esac
          python3 tools/ghidra/sv/sv400_build_sqlite.py --elf "$ELF" \
            --input "$OUT/sv400_ghidra_events.ndjson.gz" \
            --out "$OUT/sv400_main.sqlite" --report "$OUT/sv400_ghidra_manifest.json"
          python3 tools/ghidra/sv/sv400_extract_c.py \
            --input "$OUT/sv400_ghidra_events.ndjson.gz" \
            --zip "$OUT/SV400_all_decompiled_C.zip" \
            --index "$OUT/decompiled_index.csv" \
            --report "$OUT/decompiled_manifest.json" --elf-sha "$sha"
          python3 - <<'PY'
          import os, pathlib, json, sqlite3
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"sv400_out"/os.environ["GAME"]
          m=json.loads((root/"sv400_ghidra_manifest.json").read_text())
          c=json.loads((root/"decompiled_manifest.json").read_text())
          assert m["status"]=="COMPLETE" and m["counts"]["function"]>0
          assert c["decompiler_attempted"]==m["counts"]["function"]
          assert c["c_success"]+c["c_fail_or_empty"]==m["counts"]["function"]
          with sqlite3.connect(root/"sv400_main.sqlite") as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          print("Function attempts:",c["decompiler_attempted"],"C OK:",c["c_success"],"FAILED:",c["c_fail_or_empty"])
          PY

      - name: Archive editable native Ghidra .gpr + .rep without discarding raw state
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          OUT="$RUNNER_TEMP/sv400_out/$GAME"
          tar -I 'zstd -T2 -5' -C "$RUNNER_TEMP/sv400_projects/$GAME" \
            -cf "$OUT/SV400_ghidra_project.tar.zst" SV400.gpr SV400.rep
          test -s "$OUT/SV400_ghidra_project.tar.zst"
          du -sh "$OUT"

      - name: Upload complete source artifact for lossless Git publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV400-${{ matrix.game }}-complete
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          path: ${{ runner.temp }}/sv400_out/${{ matrix.game }}/*

  publish:
    name: Validate, unpack, compare and commit both native projects + all per-function C
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: 969981/SV_Resources
    steps:
      - name: Sparse checkout safe publication destinations
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/sv/
            docs/research/sv400-ghidra-diff/
            Unpack/4.0.0/exefs/scarlet_main/ghidra12.2/
            Unpack/4.0.0/exefs/violet_main/ghidra12.2/
            .github/workflows/sv-ghidra-12.2-full.yml

      - name: Download both successful Ghidra full-artifact bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ghidra/sv/*.py
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          fi
          for game in scarlet_main violet_main; do
            name="SV400-$game-complete"
            mkdir -p "$RUNNER_TEMP/sv400_download/$name"
            gh run download "$GITHUB_RUN_ID" -R "$REPO" --name "$name" \
              --dir "$RUNNER_TEMP/sv400_download/$name"
            test -s "$RUNNER_TEMP/sv400_download/$name/sv400_main.sqlite"
            test -s "$RUNNER_TEMP/sv400_download/$name/SV400_ghidra_project.tar.zst"
          done

      - name: Losslessly split SQLite raw bytes, NDJSON JSON-lines, native project; unpack every real C
        shell: bash
        run: |
          set -euo pipefail
          for game in scarlet_main violet_main; do
            dest="Unpack/4.0.0/exefs/$game/ghidra12.2"
            test ! -e "$dest/parts_manifest.json" || {
              echo "::error::Destination already populated: refusing to overwrite an earlier verified run"
              exit 1
            }
            python3 tools/ghidra/sv/sv400_publish_split.py \
              --artifacts "$RUNNER_TEMP/sv400_download" --output "$dest" --game "$game"
            python3 tools/ghidra/sv/sv400_restore_split.py \
              --source "$dest" --out "$RUNNER_TEMP/sv400_restored/$game" --no-project
          done
          mkdir -p docs/research/sv400-ghidra-diff
          python3 tools/ghidra/sv/sv400_compare.py \
            --scarlet "$RUNNER_TEMP/sv400_download/SV400-scarlet_main-complete/sv400_main.sqlite" \
            --violet "$RUNNER_TEMP/sv400_download/SV400-violet_main-complete/sv400_main.sqlite" \
            --out docs/research/sv400-ghidra-diff

      - name: Commit verified native projects / SQLite parts / full NDJSON and version difference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for game in scarlet_main violet_main; do
            dest="Unpack/4.0.0/exefs/$game/ghidra12.2"
            for path in README.md parts_manifest.json decompiled_index.csv decompiled_manifest.json sv400_ghidra_manifest.json fde_recovery.csv; do
              git add -f -- "$dest/$path"
            done
            for section in project database ndjson; do
              git add -f -- "$dest/$section"
            done
            if test -d "$dest/project_parts"; then
              git add -f -- "$dest/project_parts"
            fi
          done
          git add -f -- docs/research/sv400-ghidra-diff/
          git commit -m 'data(sv400): publish verified Scarlet and Violet native Ghidra projects and lossless SQLite NDJSON'
          if ! git push origin HEAD:refs/heads/master; then
            branch="ghidra/sv400-$GITHUB_RUN_ID"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create -R "$REPO" --base master --head "$branch" --title 'Publish SV 4.0.0 Ghidra 12.2 verified outputs' \
              --body 'Master changed during the long-running conversion. No force-push or auto-rebase. Verified native Ghidra projects, SQLite and NDJSON are on this safe PR branch.' || true
            echo "::warning::Master advanced; uploaded verified outputs to PR branch $branch"
            exit 0
          fi

      - name: Commit all successful per-function decompiled .c individually in manageable batches
        shell: bash
        run: |
          set -euo pipefail
          for game in scarlet_main violet_main; do
            dest="Unpack/4.0.0/exefs/$game/ghidra12.2"
            mapfile -d '' -t files < <(find "$dest/c" -type f -name '*.c' -print0 | sort -z)
            count="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["c_files"])' "$dest/parts_manifest.json")"
            test "${#files[@]}" -eq "$count"
            batch=0
            for ((i=0; i<${#files[@]}; i+=1200)); do
              batch=$((batch+1))
              git add -f -- "${files[@]:i:1200}"
              git commit -m "data(sv400): $game Ghidra C pseudocode batch $batch of $count"
              if ! git push origin HEAD:refs/heads/master; then
                branch="ghidra/sv400-$GITHUB_RUN_ID"
                git push origin "HEAD:refs/heads/$branch"
                gh pr create -R "$REPO" --base master --head "$branch" --title 'Finish SV 4.0.0 Ghidra C source publication' \
                  --body 'Concurrent master movement prevented a fast-forward. This branch contains the verified C source batches. No history rewriting.' || true
                echo "::warning::C publication continues in safe branch $branch"
                exit 0
              fi
            done
          done
          echo "All Ghidra C pseudocode files committed to master."

      - name: Upload publication and comparison verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV400-Ghidra12-publication-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            docs/research/sv400-ghidra-diff/
            ${{ runner.temp }}/sv400_restored/*/restore_report.json
