name: SV 4.0.0 PKHeX and Serebii encounter crosscheck
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/Triangulate-SV-PKHeX-Serebii.py', 'data/reference/sv400-serebii-selected-locations.json', 'tests/test_sv_serebii_triangulation.py', '.github/workflows/sv-pkhex-serebii-triangulation.yml']
  push:
    branches: [master]
    paths: ['scripts/Triangulate-SV-PKHeX-Serebii.py', 'data/reference/sv400-serebii-selected-locations.json', 'tests/test_sv_serebii_triangulation.py', '.github/workflows/sv-pkhex-serebii-triangulation.yml']
permissions:
  contents: read
  actions: read
jobs:
  no-rom-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/Triangulate-SV-PKHeX-Serebii.py
            data/reference/sv400-serebii-selected-locations.json
            tests/test_sv_serebii_triangulation.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/Triangulate-SV-PKHeX-Serebii.py
          python -m unittest discover -s tests -p test_sv_serebii_triangulation.py -v
  real-pkhex-audit:
    if: github.event_name != 'pull_request'
    needs: no-rom-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/Triangulate-SV-PKHeX-Serebii.py
            data/reference/sv400-serebii-selected-locations.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse original LegalityAnalysis 88-case report, not invented PK9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 42355142609 -R "$GITHUB_REPOSITORY" -n SV-400-native-pk9-legality-flip-158-triage -D "$RUNNER_TEMP/source"
          cases="$(find "$RUNNER_TEMP/source" -name sv-400-pk9-cases.csv)"
          audit="$(find "$RUNNER_TEMP/source" -name sv-400-pk9-verdict-root-cause-audit.json)"
          test -s "$cases" && test -s "$audit"
          test "$(find "$RUNNER_TEMP/source" -name sv-400-pk9-cases.csv | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/source" -name sv-400-pk9-verdict-root-cause-audit.json | wc -l)" -eq 1
          python scripts/Triangulate-SV-PKHeX-Serebii.py \
            --cases "$cases" --audit "$audit" \
            --facts data/reference/sv400-serebii-selected-locations.json \
            --output "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SV-400-PKHeX-Serebii-88-cross-source-audit
          path: |
            ${{ runner.temp }}/result/*.csv
            ${{ runner.temp }}/result/*.json
          if-no-files-found: warn
          retention-days: 30
