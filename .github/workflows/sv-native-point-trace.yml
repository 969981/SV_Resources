            dotnet tools/pkNX/pkNX.EncounterCLI/bin/Release/net10.0/pkNX.EncounterCLI.dll @baseArgs --output $dest --crossover-ab-mode $mode
            if ($LASTEXITCODE -ne 0) { throw "Actual original 61+223 Kitakami crossover A/B failed for $mode" }
          }

      - name: Compare exact native 30f A/B to pinned PKHeX; assert non-158 wild and all fixed/raid SHA unchanged
        shell: pwsh
        run: |
          $p=$env:RUNNER_TEMP
          python scripts/Compare-SV400-Source158-Original-AB.py --baseline "$env:SV_POINT_GENERATED" --manifest "$env:SV_NATIVE_BASELINE/SV400_Native_To_PKHeX_Manifest.json" --tolerance "$p/SV-400-AB-30f" --auditor scripts/Audit-SV-PKHeX-Encounters.py --variant "kitakami-158-worldend-strict=$p/SV400-cross158-AB-kitakami-158-worldend-strict" --variant "kitakami-158-worldend-exclude=$p/SV400-cross158-AB-kitakami-158-worldend-exclude" --variant "kitakami-158-exact-source-area=$p/SV400-cross158-AB-kitakami-158-exact-source-area" --variant "kitakami-158-prefer-specific-owner=$p/SV400-cross158-AB-kitakami-158-prefer-specific-owner" --variant "kitakami-158-strict-prefer-specific-owner=$p/SV400-cross158-AB-kitakami-158-strict-prefer-specific-owner" --output "$p/SV400-cross158-AB-comparison"
          if ($LASTEXITCODE -ne 0) { throw 'The isolated 158 A/B modified unrelated encounter tables or cannot reproduce original PKHeX reference differences' }
          $result=Get-Content "$p/SV400-cross158-AB-comparison/SV400_Kitakami158_Original_AB_vs_PKHeX.json" -Raw | ConvertFrom-Json
          if ($result.baseline_focal_cross158.native -ne 3145 -or $result.baseline_focal_cross158.matched -ne 808 -or $result.baseline_focal_cross158.native_only -ne 2337) {
            throw 'Source-verified 3145/808/2337 original CrossFrom=158 baseline drift'
          }
          $result.comparisons | Format-Table mode,match_delta,baseline_reference_matches_lost,new_reference_matches_recovered,native_only_delta,pkhex_only_delta -AutoSize | Out-String | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Multiset baseline matching slot retention and new matching slot recovery are reported separately; net matches alone can hide losses. Non-158 wild and fixed + 3 raid .pkl are SHA-identical. Parity is not game legality." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

