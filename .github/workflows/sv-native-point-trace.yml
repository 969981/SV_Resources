name: SV original 4.0.0 PointData and fixed symbol causal trace

on:
  pull_request:
    paths:
      - 'tools/pkNX/pkNX.WinForms/Dumping/Gen9/**'
      - 'tools/pkNX/pkNX.EncounterCLI/Program.cs'
      - 'scripts/Join-SV-Native-Point-Trace.py'
      - 'scripts/Audit-SV400-Cross158-Geometry-Merges.py'
      - 'tests/test_sv_native_point_trace_join.py'
      - 'tests/test_sv_158_crossover_geometry_merge.py'
      - 'scripts/Compare-SV-Terarium-176-194-Native-AB.py'
      - 'scripts/Verify-SV-Fixed-158-Collision-Sources.py'
      - 'tests/test_sv_fixed_collision_source_proof.py'
      - '.github/workflows/sv-native-point-trace.yml'
  push:
    branches: [master]
    paths:
      - 'tools/pkNX/pkNX.WinForms/Dumping/Gen9/**'
      - 'tools/pkNX/pkNX.EncounterCLI/Program.cs'
      - 'scripts/Join-SV-Native-Point-Trace.py'
      - 'scripts/Audit-SV400-Cross158-Geometry-Merges.py'
      - 'tests/test_sv_native_point_trace_join.py'
      - 'tests/test_sv_158_crossover_geometry_merge.py'
      - 'scripts/Compare-SV-Terarium-176-194-Native-AB.py'
      - 'scripts/Verify-SV-Fixed-158-Collision-Sources.py'
      - 'tests/test_sv_fixed_collision_source_proof.py'
      - '.github/workflows/sv-native-point-trace.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sv-original-400-targeted-point-geometry-trace
  cancel-in-progress: false

jobs:
  compile-no-rom:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/pkNX/**
            scripts/Join-SV-Native-Point-Trace.py
            scripts/Audit-SV400-Cross158-Geometry-Merges.py
            tests/test_sv_native_point_trace_join.py
            tests/test_sv_158_crossover_geometry_merge.py
            tests/test_sv_fixed_collision_source_proof.py
            scripts/Verify-SV-Fixed-158-Collision-Sources.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact vendor pkNX and execute fail-closed source-identity tests
        shell: pwsh
        run: |
          dotnet build tools/pkNX/pkNX.EncounterCLI/pkNX.EncounterCLI.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'pkNX native trace instrumented headless parser could not compile' }
          python -m unittest discover -s tests -p test_sv_native_point_trace_join.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native original point trace tests failed' }
          python -m unittest discover -s tests -p test_sv_158_crossover_geometry_merge.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original CrossFrom 158 collider trace regression tests failed' }
          python -m unittest discover -s tests -p test_sv_fixed_collision_source_proof.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original collision source SHA tests failed' }

  original-native-replay:
    needs: compile-no-rom
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reject insufficient disk; restore original private game data read-only
        shell: pwsh
        run: |
          $disk = Get-PSDrive D -ErrorAction Stop
          if ($disk.Free -lt 36GB) { throw 'Need >=36 GiB for 8GiB original archive restore and full SHA verification' }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/sv-native-pkhex-one-shot.yml
            violet_4.0.0_romfs_transfer_manifest.json
            4.0.0/1/arc/data.trpfd
            4.0.0/1/arc/data.trpfs.7z.*
            scripts/SV-RomFS.Transfer.psm1
            scripts/Restore-SV-Violet-RomFS.ps1
            scripts/Prepare-SV-Trinity.ps1
            scripts/Run-SV-FullExtract.py
            scripts/sv_m2_parallel.py
            scripts/Locate-SV-PKHeX-Native-Packs.py
            scripts/Extract-SV-PKHeX-Native-Packs.py
            scripts/Resolve-SV-PKHeX-Havok-References.py
            scripts/Extract-SV-PKHeX-TRCOL-Packs.py
            scripts/Compare-SV-Native-PKHeX-Encounters.py
            scripts/Audit-SV-PKHeX-Encounters.py
            scripts/Compare-SV-Terarium-176-194-Native-AB.py
            scripts/Verify-SV-Fixed-158-Collision-Sources.py
            scripts/Join-SV-Native-Point-Trace.py
            scripts/Audit-SV400-Cross158-Geometry-Merges.py
            scripts/Sweep-SV-Collision-Tolerance.py
            scripts/deps/oo2core_8_win64.dll
            tools/SV.TrinityDump/**
            tools/gftool/**
            tools/HashCaches/SV/**
            tools/pkNX/**
            tools/PKHeX.Gen9LegalityProbe/**
            Unpack/4.0.0/romfs/arc/data.trpfd/_index/**

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reproduce 61/61 locations from real original TRPFD
        shell: pwsh
        run: |
          git config core.longpaths true
          python scripts/Locate-SV-PKHeX-Native-Packs.py
          if ($LASTEXITCODE -ne 0) { throw 'Native file index lookup failed' }
          $m = Get-Content 'Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-packs.json' -Raw | ConvertFrom-Json
          if ($m.summary.located -ne 61 -or $m.summary.selected_packs -ne 11 -or $m.summary.missing -ne 0 -or $m.summary.ambiguous -ne 0) {
            throw 'Original game file index does not match proven 4.0.0 61-file/11-pack evidence'
          }
          Write-Host '61 original pkNX encounter sources found in 11 native packs.'

      - name: Verify source 7z divisions, cache SHA and native decoder inputs
        shell: pwsh
        run: |
          if (@(Get-ChildItem '4.0.0/1/arc/data.trpfs.7z.*' -File).Count -ne 83) { throw '83 original native TRPFS segments are required' }
          if (-not (Test-Path 'scripts/deps/oo2core_8_win64.dll' -PathType Leaf)) { throw 'Oodle source dependency missing' }
          $report=Get-Content 'tools/HashCaches/SV/hashcache-report.json' -Raw | ConvertFrom-Json
          $sha=(Get-FileHash 'tools/HashCaches/SV/GFPAKHashCache.bin' -Algorithm SHA256).Hash
          if ($sha -ne [string]$report.sha256) { throw 'Original game hash name cache SHA256 mismatch' }

      - name: Restore and SHA verify 8GB original SV native archive in isolated workspace
        shell: pwsh
        run: |
          $path=Join-Path $env:RUNNER_TEMP 'SV-4.0.0-PKHeX-Original'
          New-Item -ItemType Directory -Force $path | Out-Null
          New-Item -ItemType Directory -Force 'tools/_local' | Out-Null
          Copy-Item 'tools/HashCaches/SV/GFPAKHashCache.bin' 'tools/_local/GFPAKHashCache.bin' -Force
          & ./scripts/Prepare-SV-Trinity.ps1 -Workspace $path -SkipHashBuild
          if (-not $?) { throw 'Restored original SV 4.0.0 TRPFD/TRPFS checksum failed' }
          "SV_NATIVE_ROMFS=$path" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract 11 exact native packages and verify ALL 61 pkNX source files
        shell: pwsh
        run: |
          python scripts/Extract-SV-PKHeX-Native-Packs.py --repo . --workspace $env:SV_NATIVE_ROMFS --selection Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-packs.json --max-packs 32 --max-packed-mib 64
          if ($LASTEXITCODE -ne 0) { throw 'Original SV native files or their SHA256 were not verified' }

      - name: Discover Havok collision file names from actual native TRSCN, not filenames guessed
        shell: pwsh
        run: |
          python scripts/Resolve-SV-PKHeX-Havok-References.py --repo .
          if ($LASTEXITCODE -ne 0) { throw 'Havok native TRCOL dependency resolver did not close all paths' }

      - name: Extract every original Havok TRCOL dependency with SHA verification
        shell: pwsh
        run: |
          $dependencies='Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-trcol-dependencies.json'
          if (-not (Test-Path $dependencies -PathType Leaf)) { throw 'Native 4.0.0 TRSCN references were not parsed' }
          $report=Get-Content $dependencies -Raw | ConvertFrom-Json
          if ($report.unresolved_count -gt 0) { throw "Original Havok paths unresolved: $($report.unresolved_count)" }
          python scripts/Extract-SV-PKHeX-TRCOL-Packs.py --repo . --workspace $env:SV_NATIVE_ROMFS --manifest $dependencies --max-packs 256 --max-packed-mib 1024
          if ($LASTEXITCODE -ne 0) { throw 'One or more native TRCOL source SHA validation failed' }

      - name: Compile exact pkNX Gen9 parser including real Kitakami fog source
        shell: pwsh
        run: |
          dotnet build tools/pkNX/pkNX.EncounterCLI/pkNX.EncounterCLI.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Native Gen9 pkNX headless engine build failed' }


      - name: Download genuine 666/189 targets and original untraced 30f SHA manifest
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'SV-400-real-triage-targets'
          $baseline = Join-Path $env:RUNNER_TEMP 'SV-400-untraced-baseline'
          New-Item -ItemType Directory -Force $target,$baseline | Out-Null
          gh run download 42365891420 -R $env:GITHUB_REPOSITORY -n SV400-source-verified-wild-level-fixed-158-root-cause-triage -D $target
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve genuinely verified 666/189 target CSVs' }
          gh run download 42362541291 -R $env:GITHUB_REPOSITORY -n SV-400-source-attested-native-PKHeX-encounter-bridge -D $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve original 61+223 SHA native baseline' }
          foreach ($name in @('wild_level_range_pairs.csv','fixed_158_counterfactual_pairs.csv')) {
            if (-not (Test-Path (Join-Path $target $name))) { throw "Missing original target: $name" }
          }
          if (-not (Test-Path (Join-Path $baseline 'SV400_Native_To_PKHeX_Manifest.json'))) { throw 'Original source signature manifest not found' }
          "SV_TARGET_PROVENANCE=$target" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SV_NATIVE_BASELINE=$baseline" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Re-run original unmodified 30f pkNX output with read-only PointData and fixed placement event trace
        shell: pwsh
        run: |
          $generated=Join-Path $env:RUNNER_TEMP 'SV-400-traced-native'
          $trace=Join-Path $env:RUNNER_TEMP 'SV-400-point-trace/point-events.jsonl'
          $argsList=@('--virtual-root','Unpack/4.0.0/romfs/arc/data.trpfs/virtual','--verified-manifest','Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json','--verified-trcol-manifest','Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-trcol-extraction.json','--trace-targets',$env:SV_TARGET_PROVENANCE,'--trace-output',$trace,'--output',$generated)
          dotnet tools/pkNX/pkNX.EncounterCLI/bin/Release/net10.0/pkNX.EncounterCLI.dll @argsList
          if ($LASTEXITCODE -ne 0) { throw 'Source-verified original 4.0.0 pkNX trace generation incomplete' }
          if (-not (Test-Path $trace)) { throw 'The original native generator did not record point-level trace' }
          "SV_POINT_TRACE=$trace" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SV_POINT_GENERATED=$generated" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove untouched five native PKHeX pkl SHA and correlate actual original points to 666/189 cases
        shell: pwsh
        run: |
          python scripts/Join-SV-Native-Point-Trace.py --trace "$env:SV_POINT_TRACE" --targets "$env:SV_TARGET_PROVENANCE" --native-output "$env:SV_POINT_GENERATED" --bridge-manifest "$env:SV_NATIVE_BASELINE/SV400_Native_To_PKHeX_Manifest.json" --output "$env:RUNNER_TEMP/SV-400-point-provenance-linked"
          if ($LASTEXITCODE -ne 0) { throw 'Real original generator changed pkl bytes or source contributor correlation failed' }
          $report=Get-Content "$env:RUNNER_TEMP/SV-400-point-provenance-linked/SV400_Point_Trace_Validation.json" -Raw | ConvertFrom-Json
          if ($report.status -ne 'ORIGINAL_NATIVE_30F_POINT_PROVENANCE_CORRELATED_NOT_GAME_RNG_VALIDATED') { throw 'Expected full native point provenance report' }
          if ($report.wild_exact_final_serializations -eq 0 -or $report.fixed_with_original_tablekey_link -eq 0) { throw 'Trace cannot link any true source records' }
          "## Original SV 4.0.0 causal provenance trace" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Wild 666: $($report.wild_exact_final_serializations) native final matches and $($report.wild_cases_with_candidate_original_points) point candidates." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Fixed 189: $($report.fixed_with_original_tablekey_link) matched source TableKeys; 158 wander observations $($report.fixed_158_wander_observations)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "The original five native pkl SHA-256 values matched the untraced 30f baseline; this is not gameplay RNG proof." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Attribute real original CrossFrom 158 to source collider areas, zero vs 30f, and exact six-level Absorb steps
        shell: pwsh
        run: |
          $target=Join-Path $env:RUNNER_TEMP 'SV400-cross158-geometry'
          python scripts/Audit-SV400-Cross158-Geometry-Merges.py --native-csv "$env:SV_NATIVE_BASELINE/SV400_Native_Encounters_For_PKHeX.csv" --bridge "$env:SV_NATIVE_BASELINE/SV400_Native_To_PKHeX_Manifest.json" --events "$env:SV_POINT_TRACE" --output $target
          if ($LASTEXITCODE -ne 0) { throw 'Original 61+223 CrossFrom=158 source collider and six interval merge evidence did not close' }
          $proof=Get-Content "$target/SV400_Cross158_Source_Collider_and_Merge_Manifest.json" -Raw | ConvertFrom-Json
          if ($proof.native_only_cross158 -ne 2337 -or $proof.already_reference_matching_cross158 -ne 808 -or $proof.collider_area_pair_probe_count -le 0 -or $proof.six_interval_group_absorb_observation_count -le 0) {
            throw 'Original 158 source counts, original collider probes or true level merges missing'
          }
          "CrossFrom 158: 2337 source-only / 808 already matching. Original TRSCN/TRCOL collider pair probes: $($proof.collider_area_pair_probe_count); genuine six-group merges: $($proof.six_interval_group_absorb_observation_count)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Original PointData source collider ownership and zero/30f observations are diagnostic only; no .pkl changed." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Download independent pinned Gen9 30f wild diff and actual 236 fixed source case review
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/SV-400-AB-30f" | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/SV-400-AB-worldend" | Out-Null
          gh run download 42356030937 -R $env:GITHUB_REPOSITORY -n SV-400-original-collision-tolerance-30-10-0 -D "$env:RUNNER_TEMP/SV-400-AB-30f"
          if ($LASTEXITCODE -ne 0) { throw 'Original PKHeX pinned source diff unavailable' }
          gh run download 42376052498 -R $env:GITHUB_REPOSITORY -n SV400-original-source-remaining-115-wild-worldend-46-fixed-review -D "$env:RUNNER_TEMP/SV-400-AB-worldend"
          if ($LASTEXITCODE -ne 0) { throw 'Original WorldEnd FixedSymbol case evidence unavailable' }
          if (-not (Test-Path "$env:RUNNER_TEMP/SV-400-AB-30f/T30/comparison/wild_native_only.csv")) { throw 'Pinned original wild differential missing' }
          if (-not (Test-Path "$env:RUNNER_TEMP/SV-400-AB-worldend/SV400_236_Worldend_158_Fixed_Source_Area_Grouped.csv")) { throw 'Original fixed 236 cases missing' }

      - name: Generate real native 4.0.0 four isolated Terarium 176 194 level AB variants
        shell: pwsh
        run: |
          $argsList=@('--virtual-root','Unpack/4.0.0/romfs/arc/data.trpfs/virtual','--verified-manifest','Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json','--verified-trcol-manifest','Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-trcol-extraction.json')
          foreach ($mode in @('terarium-176-194-unadjusted-only','terarium-176-194-adjusted-only','terarium-176-194-strict-overlap','terarium-176-194-raw-point-levels')) {
            $dest="$env:RUNNER_TEMP/SV400-native-AB-$mode"
            dotnet tools/pkNX/pkNX.EncounterCLI/bin/Release/net10.0/pkNX.EncounterCLI.dll @argsList --output $dest --level-ab-mode $mode
            if ($LASTEXITCODE -ne 0) { throw "Original 4.0.0 isolated AB failed for mode $mode" }
          }

      - name: Verify actual wild AB vs pinned PKHeX and reject any non-target or fixed/raid modification
        shell: pwsh
        run: |
          $p=$env:RUNNER_TEMP
          python scripts/Compare-SV-Terarium-176-194-Native-AB.py --baseline "$env:SV_POINT_GENERATED" --manifest "$env:SV_NATIVE_BASELINE/SV400_Native_To_PKHeX_Manifest.json" --tolerance "$p/SV-400-AB-30f" --auditor scripts/Audit-SV-PKHeX-Encounters.py --variant "terarium-176-194-unadjusted-only=$p/SV400-native-AB-terarium-176-194-unadjusted-only" --variant "terarium-176-194-adjusted-only=$p/SV400-native-AB-terarium-176-194-adjusted-only" --variant "terarium-176-194-strict-overlap=$p/SV400-native-AB-terarium-176-194-strict-overlap" --variant "terarium-176-194-raw-point-levels=$p/SV400-native-AB-terarium-176-194-raw-point-levels" --output "$p/SV400-native-AB-comparison"
          if ($LASTEXITCODE -ne 0) { throw 'Real original Terarium level AB changed unauthorized source or output fields' }
          $result=Get-Content "$p/SV400-native-AB-comparison/SV400_Terarium_176_194_Native_AB_vs_PKHeX_Reference.json" -Raw | ConvertFrom-Json
          $result.reference_parity_comparison | Format-Table -AutoSize | Out-String | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Rebuild original fixed-only source sidecar with real AreaInfo Tag Type and exact TRSCN/TRCOL SHA
        shell: pwsh
        run: |
          $argsList=@('--virtual-root','Unpack/4.0.0/romfs/arc/data.trpfs/virtual','--verified-manifest','Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-native-extraction.json','--verified-trcol-manifest','Unpack/4.0.0/romfs/arc/data.trpfs/_index/encounter-trcol-extraction.json')
          $dir="$env:RUNNER_TEMP/SV400-native-AB-fixed-only"
          $trace="$env:RUNNER_TEMP/SV400-native-AB-fixed-events/fixed-only.jsonl"
          dotnet tools/pkNX/pkNX.EncounterCLI/bin/Release/net10.0/pkNX.EncounterCLI.dll @argsList --output $dir --level-ab-mode baseline --trace-targets "$env:SV_TARGET_PROVENANCE" --trace-output $trace --trace-fixed-only true
          if ($LASTEXITCODE -ne 0) { throw 'Original fixed-only AreaInfo collision source extraction failed' }
          python scripts/Verify-SV-Fixed-158-Collision-Sources.py --events $trace --manifest "$dir/native-encounter-build.json" --cases "$env:RUNNER_TEMP/SV-400-AB-worldend/SV400_236_Worldend_158_Fixed_Source_Area_Grouped.csv" --output "$env:RUNNER_TEMP/SV400-native-AB-fixed-source"
          if ($LASTEXITCODE -ne 0) { throw 'Source worldend area/collider/placement SHA proof missing' }
          $fixed=Get-Content "$env:RUNNER_TEMP/SV400-native-AB-fixed-source/SV400_236_Worldend_158_Original_AreaInfo_Collision_Manifest.json" -Raw | ConvertFrom-Json
          if ($fixed.cases_linked -ne 236) { throw 'Original fixed 236 cases not all linked' }
          "Real WorldEnd collision source: $($fixed.cases_linked) source cases; $($fixed.fixed_wander_worldend_events_verified) verified collision events." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SV400-real-original-level-AB-WorldEnd-158-AreaInfo-TRCOL
          path: |
            ${{ runner.temp }}/SV400-native-AB-comparison/*.csv
            ${{ runner.temp }}/SV400-native-AB-comparison/*.json
            ${{ runner.temp }}/SV400-native-AB-fixed-source/*.csv
            ${{ runner.temp }}/SV400-native-AB-fixed-source/*.json
            ${{ runner.temp }}/SV400-native-AB-fixed-events/*.jsonl
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SV400-original-point-level-and-fixed-158-attributed-evidence
          path: |
            ${{ runner.temp }}/SV-400-point-provenance-linked/*.csv
            ${{ runner.temp }}/SV-400-point-provenance-linked/*.json
            ${{ runner.temp }}/SV400-cross158-geometry/*.csv
            ${{ runner.temp }}/SV400-cross158-geometry/*.json
            ${{ runner.temp }}/SV400-cross158-geometry/*.jsonl
            ${{ runner.temp }}/SV-400-traced-native/native-encounter-point-trace-manifest.json
            ${{ runner.temp }}/SV-400-traced-native/native-encounter-build.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SV400-original-point-events-raw-targeted-trace
          path: |
            ${{ runner.temp }}/SV-400-point-trace/*.jsonl
          if-no-files-found: warn
          retention-days: 14
