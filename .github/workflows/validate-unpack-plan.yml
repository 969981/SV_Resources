name: Validate SV unpack tooling
on:
  push:
    paths:
      - 'scripts/Plan-SV-Unpack.py'
      - 'scripts/Build-SV-GFPAKHashCache.py'
      - 'scripts/Build-PokeDocs-HashCaches.py'
      - 'tests/test_*.py'
      - 'tools/SV.TrinityDump/**'
      - 'tools/upstream.json'
      - 'tools/gftool/**'
      - '.gitmodules'
      - 'scripts/Sync-SV-Tools.ps1'
      - 'scripts/Prepare-SV-Trinity.ps1'
      - '.github/workflows/validate-unpack-plan.yml'
  pull_request:
    paths:
      - 'scripts/Plan-SV-Unpack.py'
      - 'scripts/Build-SV-GFPAKHashCache.py'
      - 'scripts/Build-PokeDocs-HashCaches.py'
      - 'tests/test_*.py'
      - 'tools/SV.TrinityDump/**'
      - 'tools/upstream.json'
      - 'tools/gftool/**'
      - '.gitmodules'
      - 'scripts/Sync-SV-Tools.ps1'
      - 'scripts/Prepare-SV-Trinity.ps1'
      - '.github/workflows/validate-unpack-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            .github
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/Plan-SV-Unpack.py scripts/Build-SV-GFPAKHashCache.py scripts/Build-PokeDocs-HashCaches.py tests/test_plan_sv_unpack.py tests/test_sv_hashcache.py tests/test_pokedocs_hashcaches.py
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  compile-trinity-dump:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            scripts
            .github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify gftool and nested NxMiddleware are local source trees
        shell: pwsh
        run: |
          $expected = (Get-Content tools/upstream.json -Raw | ConvertFrom-Json).tools | Where-Object name -eq 'gftool' | Select-Object -ExpandProperty sourceTreeSha
          $actual = (git rev-parse 'HEAD:tools/gftool').Trim()
          if ($actual -ne $expected) { throw "Vendored gftool SHA mismatch: $actual != $expected" }
          $gitlinks = @(git ls-tree -r HEAD -- tools/gftool | Select-String '^160000 ')
          if ($gitlinks.Count -ne 0) { throw 'Nested Gitlinks remain under gftool' }
          if (-not (Test-Path 'tools/gftool/NxMiddleware/BnTxx/BnTxx.csproj')) { throw 'NxMiddleware is missing' }
      - name: Parse Windows PowerShell integration scripts
        shell: pwsh
        run: |
          $paths = @('scripts/Prepare-SV-Trinity.ps1', 'scripts/Run-SV-TrinityDump.ps1', 'scripts/Sync-SV-Tools.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
          }
      - name: Compile net10 CLI against vendored GFTool.Core
        run: dotnet build tools/SV.TrinityDump/SV.TrinityDump.csproj -c Release --nologo
