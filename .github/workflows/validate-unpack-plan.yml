name: Validate SV unpack tooling
on:
  push:
    paths:
      - 'scripts/Plan-SV-Unpack.py'
      - 'scripts/Build-SV-GFPAKHashCache.py'
      - 'scripts/Build-PokeDocs-HashCaches.py'
      - 'tests/test_*.py'
      - 'tools/SV.TrinityDump/**'
      - 'tools/upstream.json'
      - 'tools/gftool'
      - '.gitmodules'
      - 'scripts/Sync-SV-Tools.ps1'
      - 'scripts/Prepare-SV-Trinity.ps1'
      - '.github/workflows/validate-unpack-plan.yml'
  pull_request:
    paths:
      - 'scripts/Plan-SV-Unpack.py'
      - 'scripts/Build-SV-GFPAKHashCache.py'
      - 'scripts/Build-PokeDocs-HashCaches.py'
      - 'tests/test_*.py'
      - 'tools/SV.TrinityDump/**'
      - 'tools/upstream.json'
      - 'tools/gftool'
      - '.gitmodules'
      - 'scripts/Sync-SV-Tools.ps1'
      - 'scripts/Prepare-SV-Trinity.ps1'
      - '.github/workflows/validate-unpack-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            .github
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/Plan-SV-Unpack.py scripts/Build-SV-GFPAKHashCache.py scripts/Build-PokeDocs-HashCaches.py tests/test_plan_sv_unpack.py tests/test_sv_hashcache.py tests/test_pokedocs_hashcaches.py
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  compile-trinity-dump:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            scripts
            .github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Initialize pinned gftool submodule (never install Oodle)
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive -- tools/gftool
          if ($LASTEXITCODE -ne 0) { throw 'gftool submodule checkout failed' }
          $expected = (Get-Content tools/upstream.json -Raw | ConvertFrom-Json).tools | Where-Object name -eq 'gftool' | Select-Object -ExpandProperty ref
          $actual = git -C tools/gftool rev-parse HEAD
          if ($actual.Trim() -ne $expected) { throw "gftool SHA mismatch: $actual" }
      - name: Parse Windows PowerShell integration scripts
        shell: pwsh
        run: |
          $paths = @('scripts/Prepare-SV-Trinity.ps1', 'scripts/Run-SV-TrinityDump.ps1', 'scripts/Sync-SV-Tools.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
          }
      - name: Compile net8 CLI against pinned GFTool.Core
        run: dotnet build tools/SV.TrinityDump/SV.TrinityDump.csproj -c Release --nologo
