name: SV Gen9 actual PKHeX event PK9 legality smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sv-gen9-event-legality.yml'
      - 'tools/PKHeX.Gen9EventLegalityProbe/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/sv-gen9-event-legality.yml'
      - 'tools/PKHeX.Gen9EventLegalityProbe/**'

permissions:
  contents: read
  actions: read

jobs:
  pinned-pkhex-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/PKHeX.Gen9EventLegalityProbe/**
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore exact reference, not mutable PKHeX HEAD
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/PKHeX-Reference"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/kwsch/PKHeX.git
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone \
            'PKHeX.Core/**' \
            'Tests/PKHeX.Core.Tests/Legality/Legal/Generation 9/**' \
            'Tests/PKHeX.Core.Tests/Legality/Legal/General/*.pk9' \
            'Directory.Build.props' \
            'Directory.Build.targets' \
            'global.json' \
            'icon.png'
          git -C "$root" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin 0660d1e1f4924b8478daec73281bb8071a82ad19
          git -C "$root" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "0660d1e1f4924b8478daec73281bb8071a82ad19"
          echo "PKHEX_PINNED_ROOT=$root" >> "$GITHUB_ENV"
      - name: Load source-attested event manifest from genuine successful SQLite run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          gh run download 42359340624 -R "$GITHUB_REPOSITORY" \
            -n SV-400-full-PKHeX-Serebii-encounter-index \
            -D "$RUNNER_TEMP/native-evidence"
          test -s "$RUNNER_TEMP/native-evidence/sv-index-events/SV400_Expanded_Encounter_Manifest.json"
      - name: Compile probe against exact pinned PKHeX.Core
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/PKHeX.Gen9EventLegalityProbe/PKHeX.Gen9EventLegalityProbe.csproj \
            -c Release --nologo "-p:PKHeXRoot=$PKHEX_PINNED_ROOT"
      - name: Execute actual LegalityAnalysis on event generated PK9 and official controls
        shell: bash
        run: |
          set -euo pipefail
          dotnet tools/PKHeX.Gen9EventLegalityProbe/bin/Release/net10.0/PKHeX.Gen9EventLegalityProbe.dll \
            --pkhex-root "$PKHEX_PINNED_ROOT" \
            --source-manifest "$RUNNER_TEMP/native-evidence/sv-index-events/SV400_Expanded_Encounter_Manifest.json" \
            --output "$RUNNER_TEMP/PKHeX-Event-Legality"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'PKHeX-Event-Legality'/'sv400-pkhex-event-legality-smoke.json'
          j=json.loads(p.read_text('utf-8-sig'))
          assert j['status']=='REAL_PKHEX_LEGALITYANALYSIS_EXECUTED_ON_PINNED_EVENT_TEMPLATE_PK9_NOT_GAME_CAPTURED'
          assert j['officialPK9ValidCount']>=6 and j['officialPK9NegativeControlsRejected']>=1
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as fp:
              fp.write('## Pinned Gen9 actual LegalityAnalysis report\\n\\n')
              for name,r in j['templateGeneratedCandidateAnalysis'].items():
                  fp.write(f"- {name}: attempted {r['attempted']}, parsed {r['parsed']}, valid {r['valid']}, matching encounter class {r['expectedClassMatches']}, negative controls rejected {r['negativeControlsRejected']}\\n")
              fp.write('\\nGenerated PK9, NOT independently game-captured or runtime RNG-verified.\\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SV-400-actual-PKHeX-event-legal-pk9-smoke
          path: |
            ${{ runner.temp }}/PKHeX-Event-Legality/*.json
          if-no-files-found: warn
          retention-days: 30
