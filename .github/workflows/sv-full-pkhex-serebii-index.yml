name: SV Gen9 full PKHeX + Serebii searchable encounter index

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sv-full-pkhex-serebii-index.yml'
      - 'scripts/Build-SV-PKHeX-Serebii-Index.py'
      - 'scripts/Extend-SV-Encounter-Index.py'
      - 'scripts/Build-SV-Serebii-Review-Queue.py'
      - 'tests/test_sv_event_outbreak_index.py'
      - 'tests/test_sv_serebii_review_queue.py'
      - 'data/reference/sv400-serebii-selected-locations.json'
      - 'tests/test_sv_full_pkhex_serebii_index.py'
  pull_request:
    paths:
      - '.github/workflows/sv-full-pkhex-serebii-index.yml'
      - 'scripts/Build-SV-PKHeX-Serebii-Index.py'
      - 'scripts/Extend-SV-Encounter-Index.py'
      - 'scripts/Build-SV-Serebii-Review-Queue.py'
      - 'tests/test_sv_event_outbreak_index.py'
      - 'tests/test_sv_serebii_review_queue.py'
      - 'data/reference/sv400-serebii-selected-locations.json'
      - 'tests/test_sv_full_pkhex_serebii_index.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/Build-SV-PKHeX-Serebii-Index.py
            scripts/Audit-SV-PKHeX-Encounters.py
            scripts/Extend-SV-Encounter-Index.py
            scripts/Build-SV-Serebii-Review-Queue.py
            tests/test_sv_full_pkhex_serebii_index.py
            tests/test_sv_event_outbreak_index.py
            tests/test_sv_serebii_review_queue.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/Build-SV-PKHeX-Serebii-Index.py
          python -m unittest discover -s tests -p test_sv_full_pkhex_serebii_index.py -v
          python -m unittest discover -s tests -p test_sv_event_outbreak_index.py -v
          python -m unittest discover -s tests -p test_sv_serebii_review_queue.py -v

  build-genuine-pkhex-reference:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/Build-SV-PKHeX-Serebii-Index.py
            scripts/Audit-SV-PKHeX-Encounters.py
            scripts/Extend-SV-Encounter-Index.py
            scripts/Build-SV-Serebii-Review-Queue.py
            data/reference/sv400-serebii-selected-locations.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact pinned PKHeX Gen9 binary tables and bilingual species text
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/PKHeX-pinned"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/kwsch/PKHeX.git
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone \
            'PKHeX.Core/Resources/legality/wild/Gen9/*' \
            'PKHeX.Core/Resources/text/other/en/text_Species_en.txt' \
            'PKHeX.Core/Resources/text/other/zh-Hans/text_Species_zh-Hans.txt'
          git -C "$root" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin 0660d1e1f4924b8478daec73281bb8071a82ad19
          git -C "$root" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          echo "SV_PKHEX_ROOT=$root" >> "$GITHUB_ENV"
      - name: Build real indexed SQLite + flat CSV and verify source SHA
        run: |
          python scripts/Build-SV-PKHeX-Serebii-Index.py \
            --pkhex-root "$SV_PKHEX_ROOT" \
            --facts data/reference/sv400-serebii-selected-locations.json \
            --output "$RUNNER_TEMP/sv-index"
          python - <<'PY'
          from pathlib import Path
          import json,os,sqlite3
          out=Path(os.environ["RUNNER_TEMP"])/"sv-index"
          d=json.loads((out/"SV400_PKHeX_Serebii_Index_Manifest.json").read_text("utf-8"))
          assert sum(v for k,v in d["rows_by_region_type"].items() if k.endswith("|wild"))==26861
          assert sum(v for k,v in d["rows_by_region_type"].items() if k.endswith("|tera_raid"))==700
          con=sqlite3.connect(out/"SV400_PKHeX_Serebii_Encounter_Index.sqlite")
          assert con.execute("SELECT COUNT(*) FROM encounters WHERE species_name_zh='搬运小匠'").fetchone()[0] > 0
          assert con.execute("SELECT COUNT(*) FROM encounters WHERE region='Blueberry' AND location_id=200").fetchone()[0] > 0
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## Source SHA-verified PKHeX Gen9 searchable index\n\n")
              for key,val in d["rows_by_region_type"].items():
                  f.write(f"- {key}: {val} lookup rows\n")
              f.write("\nWild, fixed and ordinary raid only. Serebii area species must be independently reviewed.\n")
          con.close()
          PY
      - name: Extend SQLite with actual distribution/mighty/outbreak reference templates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/Extend-SV-Encounter-Index.py \
            --pkhex-root "$SV_PKHEX_ROOT" \
            --base-index "$RUNNER_TEMP/sv-index/SV400_PKHeX_Serebii_Encounter_Index.sqlite" \
            --output "$RUNNER_TEMP/sv-index-events"
          python - <<'PY'
          import json,os,sqlite3
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'sv-index-events'
          meta=json.loads((p/'SV400_Expanded_Encounter_Manifest.json').read_text('utf-8'))
          assert meta['template_counts']['distribution_tera_raid']==174
          assert meta['template_counts']['mighty_tera_raid']==56
          assert meta['template_counts']['distribution_outbreak']==12636
          with sqlite3.connect(p/'SV400_PKHeX_Serebii_Extended_Encounter_Index.sqlite') as db:
              assert db.execute("SELECT COUNT(*) FROM event_raid_templates").fetchone()[0]==230
              assert db.execute("SELECT COUNT(*) FROM outbreak_event_templates").fetchone()[0]==12636
              assert db.execute("SELECT COUNT(*) FROM encounters").fetchone()[0]>=29110
              assert db.execute("SELECT COUNT(*) FROM all_encounters_v2").fetchone()[0]>29110
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write("\n## Historical event template source verification\n\n")
              for k,v in meta['template_counts'].items():
                  f.write(f"- {k}: {v}\n")
              f.write("\nSerebii category links are not template dates or current availability.\n")
          PY
      - name: Generate explicit Serebii coverage gap and deduplicated verification queue
        shell: bash
        run: |
          set -euo pipefail
          python scripts/Build-SV-Serebii-Review-Queue.py \
            --database "$RUNNER_TEMP/sv-index-events/SV400_PKHeX_Serebii_Extended_Encounter_Index.sqlite" \
            --output "$RUNNER_TEMP/sv-serebii-review"
          python - <<'PY'
          from pathlib import Path
          import os,json
          p=Path(os.environ['RUNNER_TEMP'])/'sv-serebii-review'
          r=json.loads((p/'SV400_Serebii_Review_Queue_Manifest.json').read_text('utf-8'))
          assert r['deduplicated_review_tasks']>1000
          assert r['underlying_encounter_view_rows']>29110
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write(f"\n## External evidence review queue\n\n{r['deduplicated_review_tasks']} deduplicated review tasks; NOT independently Serebii verified.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SV-400-full-PKHeX-Serebii-encounter-index
          path: |
            ${{ runner.temp }}/sv-index/*.sqlite
            ${{ runner.temp }}/sv-index/*.csv
            ${{ runner.temp }}/sv-index/*.json
            ${{ runner.temp }}/sv-index-events/*.sqlite
            ${{ runner.temp }}/sv-index-events/*.csv
            ${{ runner.temp }}/sv-index-events/*.json
            ${{ runner.temp }}/sv-serebii-review/*.csv
            ${{ runner.temp }}/sv-serebii-review/*.json
          if-no-files-found: warn
          retention-days: 30
