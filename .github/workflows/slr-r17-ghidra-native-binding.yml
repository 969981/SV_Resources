name: SV400 R17 Ghidra 12.2 native class xref research
on:
  push:
    branches: [master]
    paths: [".github/workflows/slr-r17-ghidra-native-binding.yml", "tools/ghidra/sv/SV400BindingTrace.java"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-elf-ghidra:
    strategy:
      fail-fast: false
      matrix:
        game: [scarlet_main, violet_main]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GAME: ${{ matrix.game }}
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_SHA: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/sv/SV400BindingTrace.java
            Unpack/4.0.0/exefs/scarlet_main/scarlet_main.elf
            Unpack/4.0.0/exefs/violet_main/violet_main.elf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Check exact original ELF SHA and AArch64
        run: |
          set -euo pipefail
          case "$GAME" in
            scarlet_main) hash=53776abb60a9d316b7b5365e0091cb7c971e62ffbf493e4541184f0d955aa79f ;;
            violet_main) hash=84e1e6c1ae3d4122eb736045cda82d075a189c718e9ba024a9fa90ee726f7d30 ;;
            *) exit 1 ;;
          esac
          file="Unpack/4.0.0/exefs/$GAME/$GAME.elf"
          echo "$hash  $file" | sha256sum -c
          readelf -h "$file" | grep -q AArch64
      - name: Install hash-pinned official Ghidra 12.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/ghidra.zip" "$GHIDRA_URL"
          echo "$GHIDRA_SHA  $RUNNER_TEMP/ghidra.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          bin="$(find "$RUNNER_TEMP/ghidra" -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "HEADLESS=$bin" >> "$GITHUB_ENV"
      - name: Recover original surrounding Ghidra function, bounded assembly and C
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/projects/$GAME" "$RUNNER_TEMP/r17/$GAME"
          elf="$GITHUB_WORKSPACE/Unpack/4.0.0/exefs/$GAME/$GAME.elf"
          dir="$RUNNER_TEMP/r17/$GAME"
          timeout --signal=TERM --kill-after=30s 55m \
            "$HEADLESS" "$RUNNER_TEMP/projects/$GAME" SVR17 \
            -import "$elf" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra/sv" \
            -analysisTimeoutPerFile 1800 -max-cpu 2 \
            -postScript SV400BindingTrace.java "$dir/binding.txt" "$GAME" \
            -log "$dir/headless.log" -scriptlog "$dir/script.log" \
            2>&1 | tee "$dir/console.log"
          grep -Fx 'KIND=R17_GHIDRA12_ORIGINAL_SV400_CLASS_STRING_REF' "$dir/binding.txt"
          grep -Fx 'CODE_WORDS=D0013821 912F2C21' "$dir/binding.txt"
          grep -Fx 'CLASS_NAME=cE35B3EB3' "$dir/binding.txt"
          grep -Fx 'CPP_ABI_STATUS=NOT_RESOLVED' "$dir/binding.txt"
          grep -Fx 'GAME_RUNTIME_STATUS=NOT_OBSERVED' "$dir/binding.txt"
          echo R17_ORIGINAL_GHIDRA_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv400-r17-ghidra-binding-${{ matrix.game }}
          path: ${{ runner.temp }}/r17/${{ matrix.game }}/*
          retention-days: 14
          if-no-files-found: warn
