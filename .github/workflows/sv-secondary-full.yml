name: SV FULL secondary sweep - all tracked Trinity virtual files

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sv-secondary-full.yml'
      - 'scripts/resource_pipeline/full_secondary.py'
      - 'scripts/resource_pipeline/parallel_secondary.py'
      - 'scripts/resource_pipeline/inspect_all.py'
      - 'scripts/resource_pipeline/process_virtual.py'
      - 'tests/test_sv_parsed_inspection.py'
      - 'tests/test_sv_secondary_parallel.py'
      - 'tests/test_sv_secondary_full.py'
      - 'scripts/resource_pipeline/audit_secondary.py'
      - 'tests/test_sv_secondary_audit.py'
      - 'tests/test_sv_virtual_second_stage.py'
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum source files per run (400..2400)
        type: string
        required: true
        default: '2400'
      workers:
        description: Concurrent isolated worker processes (1..4)
        type: string
        default: '4'
      max_tasks:
        description: Independent native folders to process per batch (1..20)
        type: string
        default: '12'
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sv-secondary-full-sweep
  cancel-in-progress: false

jobs:
  full-secondary:
    if: github.repository == '969981/SV_Resources'
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_FILES: ${{ github.event.inputs.max_files || '2400' }}
      SV_WORKERS: ${{ github.event.inputs.workers || '4' }}
      SV_MAX_TASKS: ${{ github.event.inputs.max_tasks || '12' }}
      SV_ROOT: Unpack/4.0.0/romfs/arc/data.trpfs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          filter: blob:none
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            scripts/resource_pipeline
            tests/test_sv_secondary_full.py
            tests/test_sv_secondary_audit.py
            tests/test_sv_secondary_parallel.py
            tests/test_sv_parsed_inspection.py
            tests/test_sv_virtual_second_stage.py
            tools/gftool
            tools/SV.R3.ModelExport
            tools/PokeDocs/SV/Flatbuffers
            .github/workflows/sv-secondary-full.yml
            Unpack/4.0.0/romfs/arc/data.trpfs/_index/secondary/full-state.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify parser and planner
        shell: pwsh
        run: |
          if ([int]$env:MAX_FILES -lt 400 -or [int]$env:MAX_FILES -gt 2400) { throw 'Bad max_files' }
          if ([int]$env:SV_WORKERS -lt 1 -or [int]$env:SV_WORKERS -gt 4) { throw 'Bad workers' }
          if ([int]$env:SV_MAX_TASKS -lt 1 -or [int]$env:SV_MAX_TASKS -gt 20) { throw 'Bad max_tasks' }
          git config core.longpaths true
          python -m py_compile scripts/resource_pipeline/full_secondary.py scripts/resource_pipeline/process_virtual.py scripts/resource_pipeline/parallel_secondary.py scripts/resource_pipeline/inspect_all.py scripts/resource_pipeline/audit_secondary.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compile failed' }
          python -m unittest discover -s tests -p test_sv_secondary_full.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Full-sweep tests failed' }
          python -m unittest discover -s tests -p test_sv_virtual_second_stage.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native pipeline tests failed' }
          python -m unittest discover -s tests -p test_sv_secondary_parallel.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Parallel isolated worker tests failed' }
          python -m unittest discover -s tests -p test_sv_parsed_inspection.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Exhaustive parsed coverage tests failed' }
          python -m unittest discover -s tests -p test_sv_secondary_audit.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Per-file ledger audit tests failed' }
      - name: Discover whole tracked native virtual tree
        id: plan
        shell: pwsh
        run: |
          python scripts/resource_pipeline/full_secondary.py --repo . --group-files 1200 --max-tasks $env:SV_MAX_TASKS --max-files $env:MAX_FILES select
          if ($LASTEXITCODE -ne 0) { throw 'Tree-wide native planning failed' }
          $p = Get-Content "$env:SV_ROOT/_index/secondary/full-selection.json" -Raw | ConvertFrom-Json
          "count=$($p.selected_count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "needs_bntx=$($p.needs_bntx.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "needs_models=$($p.needs_models.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Tracked $($p.total_tracked_files), outstanding $($p.remaining_before_batch), selected $($p.selected_files)"
      - name: Sparse materialize only selected original bytes
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: |
          python scripts/resource_pipeline/full_secondary.py --repo . fetch
          if ($LASTEXITCODE -ne 0) { throw 'Sparse checkout selected source failed' }
      - uses: actions/cache@v4
        if: steps.plan.outputs.needs_bntx == 'true'
        with:
          path: ~/.cargo/bin/ultimate_tex_cli.exe
          key: sv-ultimate-tex-cli-win-2ef4f090-v1
      - name: Build pinned native texture and model converters
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: |
          $plan = Get-Content "$env:SV_ROOT/_index/secondary/full-selection.json" -Raw | ConvertFrom-Json
          if ($plan.needs_bntx -and -not (Get-Command ultimate_tex_cli -ErrorAction SilentlyContinue)) {
            cargo install --locked --git https://github.com/ScanMountGoat/ultimate_tex --rev 2ef4f0904f85d696650bdefa1f18c935a09159ac ultimate_tex_cli
            if ($LASTEXITCODE -ne 0) { throw 'BC7 converter unavailable' }
          }
          if ($plan.needs_models) {
            dotnet build tools/SV.R3.ModelExport/SV.R3.ModelExport.csproj -c Release --nologo
            if ($LASTEXITCODE -ne 0) { throw '.NET10 native glTF converter failed' }
          }
          Write-Host "Pinned converters: BNTX=$($plan.needs_bntx), TRMDL=$($plan.needs_models)"
      - name: Process entire chosen batch using format validators
        if: steps.plan.outputs.count != '0'
        continue-on-error: true  # Keep successful outputs and record failed groups for bounded retry.
        shell: pwsh
        run: |
          $plan = Get-Content "$env:SV_ROOT/_index/secondary/full-selection.json" -Raw | ConvertFrom-Json
          $arguments = @("scripts/resource_pipeline/parallel_secondary.py","--repo",".","--workers",$env:SV_WORKERS,"--max-output-mb","90")
          if ($plan.needs_bntx) { $arguments += @("--png-converter","ultimate_tex_cli {input} {output}") }
          if ($plan.needs_models) {
            $exe = Join-Path $PWD "tools/SV.R3.ModelExport/bin/Release/net10.0-windows/SV.R3.ModelExport.exe"
            if (-not (Test-Path $exe)) { throw 'Model export binary missing' }
            $model = '"' + $exe + '" {input} {output}'
            $arguments += @("--model-converter", $model)
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native batch processor failed' }
      - name: Save derived outputs and checkpoint on master
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: |
          $pub = Get-Content sv-secondary-publication.json -Raw | ConvertFrom-Json
          if (-not $pub.paths) { throw 'No checkpoint to publish' }
          $paths = @($pub.paths)
          for ($i=0; $i -lt $paths.Count; $i+=80) {
            $last=[Math]::Min($i+79,$paths.Count-1)
            git -c advice.updateSparsePath=false add --sparse -f -- $paths[$i..$last]
            if ($LASTEXITCODE -ne 0) { throw 'Git add failed' }
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "data(SV): full secondary sweep checkpoint and validated conversions"
          if ($LASTEXITCODE -ne 0) { throw 'Git commit failed' }
          $pushed = $false
          for ($attempt=1; $attempt -le 6; $attempt++) {
            git fetch origin master
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh remote master' }
            git rebase origin/master
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw 'Git rebase conflict; checkpoint remains in Actions artifact'
            }
            git push origin HEAD:master
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Warning "Concurrent master update during push attempt $attempt/6; retrying fast-forward only"
            Start-Sleep -Seconds ([Math]::Min($attempt * 2, 10))
          }
          if (-not $pushed) { throw 'Six non-forced push attempts were rejected; keep checkpoint artifact' }
      - name: Automatically continue until all tracked paths are attempted
        shell: pwsh
        run: |
          python scripts/resource_pipeline/full_secondary.py --repo . status > "$env:RUNNER_TEMP/full-status.json"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot validate checkpoint status' }
          $state = Get-Content "$env:RUNNER_TEMP/full-status.json" -Raw | ConvertFrom-Json
          Write-Host "Native total=$($state.tracked_native_files), pending=$($state.remaining_files), partial groups=$($state.partial_groups), error groups=$($state.error_groups), exhausted errors=$($state.exhausted_error_groups)"
          Write-Host 'Every attempted native file now needs a parsed/ inspection record. Proprietary formats remain explicitly unparsed.'
          if ($state.remaining_groups -gt 0) {
            gh workflow run sv-secondary-full.yml --ref master -f "max_files=$env:MAX_FILES" -f "workers=$env:SV_WORKERS" -f "max_tasks=$env:SV_MAX_TASKS"
            if ($LASTEXITCODE -ne 0) { throw 'Dispatch next batch failed; checkpoint was retained' }
          }
      - name: Upload progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-secondary-full-${{ github.run_id }}
          path: |
            sv-secondary-publication.json
            Unpack/4.0.0/romfs/arc/data.trpfs/_index/secondary/full-state.json
            Unpack/4.0.0/romfs/arc/data.trpfs/_index/secondary/full-last-run.json
          if-no-files-found: warn
          retention-days: 14
