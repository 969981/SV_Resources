name: Publish SV 4.0.0 recovered main.lua (one-shot)

on:
  push:
    branches: [master]
    paths:
      - ".github/source-staging/sv-main-lua/part_*.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sv-main-lua-one-shot-master
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/source-staging/sv-main-lua/
            .github/workflows/sv-main-lua-publish-once.yml
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/script/lua/bin/release/main/recovered/
      - name: Rebuild only the verified experimental source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          stage = pathlib.Path(".github/source-staging/sv-main-lua")
          parts = sorted(stage.glob("part_*.b64"))
          assert len(parts) == 10, f"Expected 10 staging chunks, got {len(parts)}"
          compressed = b"".join(base64.b64decode(p.read_bytes()) for p in parts)
          raw = zlib.decompress(compressed)
          sha = hashlib.sha256(raw).hexdigest()
          expect = "62db3e8515f8871c27f5ef034e74db5ea5ed114756c5dbc42a671750e01266c7"
          assert len(raw) == 34448213, len(raw)
          assert sha == expect, f"Source SHA-256 mismatch: {sha}"
          target = pathlib.Path("Unpack/4.0.0/romfs/arc/data.trpfs/virtual/script/lua/bin/release/main/recovered/main.lua")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          print(f"Verified {target} ({len(raw)} bytes, sha256={sha})")
          PY
      - name: Commit source to master and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Unpack/4.0.0/romfs/arc/data.trpfs/virtual/script/lua/bin/release/main/recovered/main.lua
          git rm -r -- .github/source-staging/sv-main-lua
          git rm -- .github/workflows/sv-main-lua-publish-once.yml
          git diff --cached --check
          git commit -m "feat(lua): archive experimental SV 4.0.0 recovered main.lua"
          git push origin HEAD:master
