name: SLR R3 - experimental unluac HIR capacity-preserved lowering

on:
  push:
    branches: [feature/sv-lua54-r3-hir-ast]
    paths:
      - ".github/workflows/slr-r3-experimental-lowering.yml"
      - "scripts/R3-Experimental-Unluac-Setlist-Patch.py"
      - "scripts/R3-Export-Proto752.py"
      - "scripts/R3-Verify-Full-Proto-Metadata.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slr-r3-experimental
  cancel-in-progress: false

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SLR source and full original Proto 752
        uses: actions/checkout@v4
        with:
          path: slr
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/R3-Experimental-Unluac-Setlist-Patch.py
            scripts/R3-Export-Proto752.py
            scripts/R3-Verify-Full-Proto-Metadata.py
            tools/SV.Lua54/src/sv_lua54
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/script/lua/bin/release/main_dynamic/main_dynamic.blua
          persist-credentials: false

      - name: Checkout exact public upstream version
        uses: actions/checkout@v4
        with:
          repository: x3zvawq/unluac-rs
          ref: 76d1452359b207c2a6fdec3c7c894152c7a61374
          path: upstream
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply strictly opt-in and source-site-scoped patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "76d1452359b207c2a6fdec3c7c894152c7a61374"
          python3 slr/scripts/R3-Experimental-Unluac-Setlist-Patch.py upstream
          python3 slr/scripts/R3-Export-Proto752.py --root slr --output "$RUNNER_TEMP/full752_native.luac"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Compile patched upstream 1.4.5 Rust CLI
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo build --locked -p unluac-cli
          test -x target/debug/unluac-cli

      - name: Confirm default strict behavior still rejects residual
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(pwd)/upstream/target/debug/unluac-cli"
          set +e
          "$BIN" -i "$RUNNER_TEMP/full752_native.luac" -D lua5.4 --generate-mode strict \
            > "$RUNNER_TEMP/default.lua" 2> "$RUNNER_TEMP/default.err"
          CODE=$?
          set -e
          echo "Unpatched default strict exit: $CODE"
          tail -n 10 "$RUNNER_TEMP/default.err"
          test "$CODE" -ne 0
          grep -q 'residual table-set-list' "$RUNNER_TEMP/default.err"

      - name: Execute opt-in HIR→AST and compile complete Proto 752 Lua
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(pwd)/upstream/target/debug/unluac-cli"
          set +e
          SV_R3_EXPERIMENTAL_752=1 "$BIN" -i "$RUNNER_TEMP/full752_native.luac" \
            -D lua5.4 --generate-mode strict \
            > "$RUNNER_TEMP/experimental.lua" 2> "$RUNNER_TEMP/experimental.err"
          CODE=$?
          set -e
          echo "R3 experimental strict exit: $CODE"
          grep -E '^SV_R3 EXPERIMENT' "$RUNNER_TEMP/experimental.err" | tail -n 8 || true
          tail -n 15 "$RUNNER_TEMP/experimental.err"
          if test "$CODE" -ne 0; then
            echo "The source-site-specific proposal did NOT fully recover Proto 752"
            exit 1
          fi
          grep -q 'SV_R3 EXPERIMENT applied' "$RUNNER_TEMP/experimental.err"
          luac5.4 -p "$RUNNER_TEMP/experimental.lua"
          luac5.4 -o "$RUNNER_TEMP/experimental_recompiled.luac" "$RUNNER_TEMP/experimental.lua"
          echo "PASS complete 2071-original-opcode Proto752 STRICT Lua5.4 syntax/compile"
          python3 slr/scripts/R3-Verify-Full-Proto-Metadata.py \
            --original "$RUNNER_TEMP/full752_native.luac" \
            --recompiled "$RUNNER_TEMP/experimental_recompiled.luac" \
            --output "$RUNNER_TEMP/r3_structure_compare.json"
          python3 - "$RUNNER_TEMP/experimental.lua" "$RUNNER_TEMP/r3_full_proto_metrics.json" <<'PY'
          import hashlib, json, sys, pathlib
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes()
          result={"source":"original 4.0.0 main_dynamic Proto752 lifted; parent runtime missing",
                  "upstream":"76d1452359b207c2a6fdec3c7c894152c7a61374",
                  "r3_mode":"EXPERIMENTAL_ENV_GATED_ONLY",
                  "original_opcode_count":2071,
                  "decompiler_strict":"PASS",
                  "lua54_syntax":"PASS",
                  "lua54_compiled":"PASS",
                  "original_game_behavior":"NOT_TESTED",
                  "source_file_sha256":hashlib.sha256(b).hexdigest(),
                  "source_lines":b.count(b"\n"),
                  "source_bytes":len(b)}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Remove original test bytes and generated source after assertions
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/full752_native.luac" "$RUNNER_TEMP/default.lua" \
            "$RUNNER_TEMP/experimental.lua" "$RUNNER_TEMP/experimental_recompiled.luac"

      - name: Upload compact metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SLR-R3-Experimental-Proto752-Syntax
          path: |
            ${{ runner.temp }}/r3_full_proto_metrics.json
            ${{ runner.temp }}/r3_structure_compare.json
          retention-days: 14
          if-no-files-found: warn
