name: SV R3/R4 structural conversion and incremental rebuild

on:
  push:
    paths:
      - 'scripts/resource_pipeline/r34.py'
      - 'scripts/resource_pipeline/schema.sql'
      - 'tests/test_sv_r34_pipeline.py'
      - '.github/workflows/verify-sv-r34-pipeline.yml'
  pull_request:
    paths:
      - 'scripts/resource_pipeline/r34.py'
      - 'scripts/resource_pipeline/schema.sql'
      - 'tests/test_sv_r34_pipeline.py'
      - '.github/workflows/verify-sv-r34-pipeline.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'CI synthetic only; native-run needs a configured private self-hosted runner'
        required: true
        type: choice
        options:
          - synthetic
          - native-plan
      max_tasks:
        description: 'Maximum native tasks to list (0 = all)'
        required: false
        default: '50'
        type: string

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/resource_pipeline
            tests/test_sv_r34_pipeline.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test resumable fingerprints, GLB validation and review gate
        run: python -m unittest discover -s tests -p 'test_sv_r34_pipeline.py' -v

  native-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'native-plan'
    # Private runner only: has locally staged source files and an indexed catalog.
    # Never fetch game files or publish converted binaries as Actions artifacts.
    runs-on: [self-hosted, sv-resources]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/resource_pipeline
          sparse-checkout-cone-mode: false
      - name: Plan available native resources without converting or publishing
        env:
          MAX_TASKS: ${{ inputs.max_tasks }}
          SV_RESOURCE_ROOT: ${{ vars.SV_RESOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SV_RESOURCE_ROOT" ]]; then
            echo 'SV_RESOURCE_ROOT must point to a pre-extracted data.trpfs folder on this runner' >&2
            exit 1
          fi
          if ! [[ "$MAX_TASKS" =~ ^[0-9]+$ ]]; then
            echo 'max_tasks must be a nonnegative integer' >&2
            exit 1
          fi
          python scripts/resource_pipeline/r34.py plan --root "$SV_RESOURCE_ROOT" --limit "$MAX_TASKS" > r34-plan.jsonl
          echo 'R3/R4 plan written locally; no native data or GLB artifacts uploaded.'
          wc -l r34-plan.jsonl
