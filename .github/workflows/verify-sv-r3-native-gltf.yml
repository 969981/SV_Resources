name: Verify native SV TRMDL to glTF on Windows

on:
  pull_request:
    paths:
      - 'tools/gftool/TrinityModelViewer/**'
      - 'scripts/resource_pipeline/r3_objects.py'
      - '.github/workflows/verify-sv-r3-native-gltf.yml'
  push:
    branches:
      - feature/sv-r3-r4-object-pipeline
    paths:
      - 'tools/gftool/TrinityModelViewer/**'
      - '.github/workflows/verify-sv-r3-native-gltf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-gltf-export:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/gftool
            scripts/resource_pipeline/r3_objects.py
            Unpack/4.0.0/romfs/arc/data.trpfs/virtual/chara/model_pc/p0_bag0000_schoolbackpack
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unmodified glTF exporter with R3 headless entry
        shell: pwsh
        run: dotnet build tools/gftool/TrinityModelViewer/TrinityModelViewer.csproj -c Release --nologo
      - name: Export a real SV backpack model including LODs
        shell: pwsh
        run: |
          $folder = Join-Path $PWD 'Unpack/4.0.0/romfs/arc/data.trpfs/virtual/chara/model_pc/p0_bag0000_schoolbackpack'
          $model = Join-Path $folder 'p0_bag0000_00_bag00.trmdl'
          $dest = Join-Path $env:RUNNER_TEMP 'sv-r3-sample.gltf'
          $exe = Join-Path $PWD 'tools/gftool/TrinityModelViewer/bin/Release/net10.0-windows/TrinityModelViewer.exe'
          & $exe --export-gltf $model $dest
          if ($LASTEXITCODE -ne 0) { throw "Model exporter exited with code $LASTEXITCODE" }
          if (!(Test-Path $dest)) { throw "No glTF generated" }
          python -c "import pathlib,sys;sys.path.insert(0,'scripts/resource_pipeline');from r3_objects import validate_gltf; p=pathlib.Path(sys.argv[1]); print(validate_gltf(p,require_skin=True,require_lods=3))" "$dest"
      # Do not upload potentially copyrighted game models, textures, or glTF outputs.
