name: SV400 read-only version-state chain xrefs

on:
  push:
    branches:
      - ghidra/sv400-semantic-*
    paths:
      - .github/workflows/sv-ghidra-12.2-state-chain.yml
      - scripts/ghidra/SV400StateChainXrefs.java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sv400-statechain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  state-chain:
    name: Version-state xrefs ${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        game: [scarlet_main, violet_main]
    env:
      GAME: ${{ matrix.game }}
      GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_SHA: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
    steps:
      - name: Sparse checkout immutable published Ghidra project and read-only scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Unpack/4.0.0/exefs/${{ matrix.game }}/ghidra12.2/parts_manifest.json
            Unpack/4.0.0/exefs/${{ matrix.game }}/ghidra12.2/project/
            Unpack/4.0.0/exefs/${{ matrix.game }}/ghidra12.2/project_parts/
            scripts/ghidra/
      - name: Set up JDK for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify native Ghidra project split-part SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ghidra/restore_ghidra_project.py \
            --source "$GITHUB_WORKSPACE/Unpack/4.0.0/exefs/$GAME/ghidra12.2" \
            --out "$RUNNER_TEMP/sv400_project/$GAME" --game "$GAME" \
            | tee "$RUNNER_TEMP/restore-$GAME.json"
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 \
            --output "$RUNNER_TEMP/$GHIDRA_ZIP" "$GHIDRA_URL"
          printf '%s  %s\n' "$GHIDRA_SHA" "$RUNNER_TEMP/$GHIDRA_ZIP" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sv400_ghidra"
          unzip -q "$RUNNER_TEMP/$GHIDRA_ZIP" -d "$RUNNER_TEMP/sv400_ghidra"
          headless="$(find "$RUNNER_TEMP/sv400_ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$headless"
          chmod +x "$headless"
          echo "GHIDRA_HEADLESS=$headless" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/$GHIDRA_ZIP"
      - name: Export global xrefs and indirect pointer origins without autoanalysis
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sv400_state_chain/$GAME"
          mkdir -p "$OUT"
          timeout --signal=TERM --kill-after=30s 35m \
            "$GHIDRA_HEADLESS" "$RUNNER_TEMP/sv400_project/$GAME/project" SV400 \
            -process "$GAME.elf" -noanalysis -max-cpu 2 \
            -scriptPath "$GITHUB_WORKSPACE/scripts/ghidra" \
            -postScript SV400StateChainXrefs.java "$OUT" \
            -log "$OUT/ghidra.log" -scriptlog "$OUT/script.log" \
            2>&1 | tee "$OUT/console.log"
          test -s "$OUT/state_xrefs.tsv"
          test -s "$OUT/pointer_origins.tsv"
      - name: Upload read-only state-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV400-state-chain-${{ matrix.game }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sv400_state_chain/${{ matrix.game }}/
            ${{ runner.temp }}/restore-${{ matrix.game }}.json
